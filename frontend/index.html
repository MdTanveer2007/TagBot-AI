<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TagBot AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .app {
            width: 100%;
            max-width: 800px;
            height: 85vh;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            padding: 18px 22px;
            border-bottom: 1px solid #e5e7eb;
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
        }

        .header p {
            margin: 5px 0 0;
            color: #6b7280;
            font-size: 14px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .memory-panel {
            border-bottom: 1px solid #e5e7eb;
            padding: 16px 22px;
            background: #fafafa;
        }

        .memory-panel[hidden] {
            display: none;
        }

        .memory-panel__header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: 600;
        }

        .memory-list-items {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .memory-item {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 12px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            font-size: 14px;
        }

        .memory-item__text {
            flex: 1;
            white-space: pre-wrap;
        }

        .memory-empty {
            margin: 0;
            color: #6b7280;
            font-size: 14px;
        }

        .chat-list-items,
        .memory-list-items {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-item {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 12px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
        }

        .chat-item__text {
            flex: 1;
        }

        .chat-item__meta {
            color: #6b7280;
            font-size: 12px;
            margin-top: 4px;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .message {
            max-width: 78%;
            padding: 12px 15px;
            border-radius: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .bot {
            align-self: flex-start;
            background: #eef2ff;
        }

        .user {
            align-self: flex-end;
            background: #111827;
            color: white;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 16px;
            border-top: 1px solid #e5e7eb;
        }

        #messageInput {
            resize: none;
            overflow-y: hidden;
            min-height: 46px;
            max-height: 140px;
            flex: 1;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            line-height: 1.4;
        }

        #sendButton {
            border: none;
            border-radius: 12px;
            padding: 0 20px;
            font-size: 15px;
            cursor: pointer;
            background: #111827;
            color: white;
        }

        #sendButton:hover {
            opacity: 0.9;
        }.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
}

#newChatButton,
#memoriesButton,
#chatsButton,
#closeMemoriesButton,
#closeChatsButton,
.memory-delete-button,
.chat-delete-button {
    border: 1px solid #d1d5db;
    background: white;
    padding: 9px 14px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
}

#newChatButton:hover,
#memoriesButton:hover,
#chatsButton:hover,
#closeMemoriesButton:hover,
#closeChatsButton:hover,
.memory-delete-button:hover,
.chat-delete-button:hover {
    background: #f9fafb;
}

.memory-delete-button,
.chat-delete-button {
    padding: 7px 10px;
    color: #b91c1c;
}
    </style>
</head>

<body>
    <main class="app">
       <header class="header">
    <div>
        <h1>TagBot AI</h1>
        <p>Your personal AI assistant</p>
    </div>

    <div class="header-actions">
        <button id="memoriesButton" type="button">
            Memories
        </button>
        <button id="chatsButton" type="button">
            Chats
        </button>
        <button id="newChatButton" type="button">
            New Chat
        </button>
    </div>
</header>

        <section class="memory-panel" id="memoryPanel" hidden>
            <div class="memory-panel__header">
                <span>Saved memories</span>
                <button id="closeMemoriesButton" type="button">
                    Close
                </button>
            </div>
            <div id="memoryList">
                <p class="memory-empty">Loading memories…</p>
            </div>
        </section>

        <section class="memory-panel" id="chatsPanel" hidden>
            <div class="memory-panel__header">
                <span>Saved chats</span>
                <button id="closeChatsButton" type="button">
                    Close
                </button>
            </div>
            <div id="chatList">
                <p class="memory-empty">Loading chats…</p>
            </div>
        </section>

        <section class="messages" id="messages">
        </section>

        <form class="input-area" id="chatForm">
           <textarea
    id="messageInput"
    placeholder="Message TagBot..."
    rows="1"
    required
></textarea>

            <button id="sendButton" type="submit">
                Send
            </button>
        </form>
    </main>

  <script>
    const chatForm = document.getElementById("chatForm");
    const messageInput = document.getElementById("messageInput");
    const messages = document.getElementById("messages");
    const sendButton = document.getElementById("sendButton");
    const newChatButton = document.getElementById("newChatButton");
    const memoriesButton = document.getElementById("memoriesButton");
    const chatsButton = document.getElementById("chatsButton");
    const memoryPanel = document.getElementById("memoryPanel");
    const memoryList = document.getElementById("memoryList");
    const closeMemoriesButton = document.getElementById("closeMemoriesButton");
    const chatsPanel = document.getElementById("chatsPanel");
    const chatList = document.getElementById("chatList");
    const closeChatsButton = document.getElementById("closeChatsButton");
    let currentConversationMessages = [];

    function adjustTextareaHeight() {
        messageInput.style.height = "auto";
        const maxHeight = 140;
        const nextHeight = Math.min(messageInput.scrollHeight, maxHeight);
        messageInput.style.height = `${nextHeight}px`;
    }

    function addMessage(text, sender) {
        const message = document.createElement("div");
        message.className = `message ${sender}`;
        message.textContent = text;

        messages.appendChild(message);
        messages.scrollTop = messages.scrollHeight;

        return message;
    }

    function renderConversation(conversation) {
        currentConversationMessages = Array.isArray(conversation.messages) ? conversation.messages : [];
        messages.innerHTML = "";

        if (!currentConversationMessages.length) {
            addMessage("Hello bhai! Main TagBot AI hoon.", "bot");
            return;
        }

        currentConversationMessages.forEach((message) => {
            addMessage(message.text, message.role === "user" ? "user" : "bot");
        });
    }

    async function loadConversationState() {
        try {
            const response = await fetch("/api/conversations");
            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || "Unable to load chat history.");
            }

            if (data.activeConversation) {
                renderConversation(data.activeConversation);
            } else {
                renderConversation({ messages: [] });
            }
        } catch (error) {
            messages.innerHTML = "";
            addMessage(`Error: ${error.message}`, "bot");
        }
    }

    async function loadMemories() {
        memoryPanel.hidden = false;
        memoryList.innerHTML = '<p class="memory-empty">Loading memories…</p>';

        try {
            const response = await fetch("/api/memories");
            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || "Unable to load memories.");
            }

            const memories = Array.isArray(data.memories) ? data.memories : [];

            if (!memories.length) {
                memoryList.innerHTML = '<p class="memory-empty">No permanent memories saved yet.</p>';
                return;
            }

            const ul = document.createElement("ul");
            ul.className = "memory-list-items";

            memories.forEach((memory) => {
                const li = document.createElement("li");
                li.className = "memory-item";
                li.innerHTML = `
                    <div class="memory-item__text">
                        <strong>${memory.number}. </strong>${memory.text}
                    </div>
                    <button class="memory-delete-button" type="button">
                        Delete
                    </button>
                `;

                const deleteButton = li.querySelector(".memory-delete-button");
                deleteButton.addEventListener("click", async function () {
                    const confirmed = window.confirm(`Delete memory ${memory.number}?`);

                    if (!confirmed) {
                        return;
                    }

                    try {
                        const deleteResponse = await fetch(`/api/memories/${encodeURIComponent(memory.id)}`, {
                            method: "DELETE"
                        });
                        const deleteData = await deleteResponse.json();

                        if (!deleteResponse.ok) {
                            throw new Error(deleteData.error || "Delete failed.");
                        }

                        await loadMemories();
                    } catch (error) {
                        memoryList.innerHTML = `<p class="memory-empty">Error: ${error.message}</p>`;
                    }
                });

                ul.appendChild(li);
            });

            memoryList.innerHTML = "";
            memoryList.appendChild(ul);
        } catch (error) {
            memoryList.innerHTML = `<p class="memory-empty">Error: ${error.message}</p>`;
        }
    }

    async function loadChats() {
        chatsPanel.hidden = false;
        chatList.innerHTML = '<p class="memory-empty">Loading chats…</p>';

        try {
            const response = await fetch("/api/conversations");
            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || "Unable to load chats.");
            }

            const conversations = Array.isArray(data.conversations) ? data.conversations : [];

            if (!conversations.length) {
                chatList.innerHTML = '<p class="memory-empty">No saved chats yet.</p>';
                return;
            }

            const ul = document.createElement("ul");
            ul.className = "chat-list-items";

            conversations.forEach((conversation) => {
                const li = document.createElement("li");
                li.className = "chat-item";
                li.innerHTML = `
                    <div class="chat-item__text">
                        <strong>${conversation.title}</strong>
                        <div class="chat-item__meta">${conversation.updated_at}</div>
                    </div>
                    <button class="chat-delete-button" type="button">
                        Delete
                    </button>
                `;

                li.addEventListener("click", async function (event) {
                    if (event.target.classList.contains("chat-delete-button")) {
                        return;
                    }

                    try {
                        const conversationResponse = await fetch(`/api/conversations/${encodeURIComponent(conversation.id)}`);
                        const conversationData = await conversationResponse.json();

                        if (!conversationResponse.ok) {
                            throw new Error(conversationData.error || "Unable to load conversation.");
                        }

                        renderConversation(conversationData.conversation);
                        chatsPanel.hidden = true;
                    } catch (error) {
                        chatList.innerHTML = `<p class="memory-empty">Error: ${error.message}</p>`;
                    }
                });

                const deleteButton = li.querySelector(".chat-delete-button");
                deleteButton.addEventListener("click", async function (event) {
                    event.stopPropagation();
                    const confirmed = window.confirm("Delete this conversation?");

                    if (!confirmed) {
                        return;
                    }

                    try {
                        const deleteResponse = await fetch(`/api/conversations/${encodeURIComponent(conversation.id)}`, {
                            method: "DELETE"
                        });
                        const deleteData = await deleteResponse.json();

                        if (!deleteResponse.ok) {
                            throw new Error(deleteData.error || "Delete failed.");
                        }

                        await loadChats();
                    } catch (error) {
                        chatList.innerHTML = `<p class="memory-empty">Error: ${error.message}</p>`;
                    }
                });

                ul.appendChild(li);
            });

            chatList.innerHTML = "";
            chatList.appendChild(ul);
        } catch (error) {
            chatList.innerHTML = `<p class="memory-empty">Error: ${error.message}</p>`;
        }
    }

    messageInput.addEventListener("input", adjustTextareaHeight);

    messageInput.addEventListener("keydown", function (event) {
        if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            chatForm.requestSubmit();
        }
    });

    chatForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const text = messageInput.value.trim();

        if (!text) {
            return;
        }

        currentConversationMessages.push({ role: "user", text });
        addMessage(text, "user");
        messageInput.value = "";
        adjustTextareaHeight();
        sendButton.disabled = true;

        const loadingMessage = addMessage("Soch raha hoon...", "bot");

        try {
            const response = await fetch("/api/chat", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: text
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || "Request failed.");
            }

            currentConversationMessages.push({ role: "assistant", text: data.reply });
            loadingMessage.textContent = data.reply;
        } catch (error) {
            loadingMessage.textContent = `Error: ${error.message}`;
        } finally {
            sendButton.disabled = false;
            messageInput.focus();
        }
    });

    memoriesButton.addEventListener("click", async function () {
        chatsPanel.hidden = true;

        if (memoryPanel.hidden) {
            await loadMemories();
        } else {
            memoryPanel.hidden = true;
        }
    });

    chatsButton.addEventListener("click", async function () {
        memoryPanel.hidden = true;

        if (chatsPanel.hidden) {
            await loadChats();
        } else {
            chatsPanel.hidden = true;
        }
    });

    closeMemoriesButton.addEventListener("click", function () {
        memoryPanel.hidden = true;
    });

    closeChatsButton.addEventListener("click", function () {
        chatsPanel.hidden = true;
    });

    newChatButton.addEventListener("click", async function () {
        newChatButton.disabled = true;

        try {
            const response = await fetch("/api/reset", {
                method: "POST"
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || "Reset failed.");
            }

            currentConversationMessages = [];
            messages.innerHTML = "";
            addMessage(
                "New chat start ho gayi. Permanent memories safe hain.",
                "bot"
            );
            await loadChats();
        } catch (error) {
            addMessage(`Error: ${error.message}`, "bot");
        } finally {
            newChatButton.disabled = false;
            messageInput.focus();
        }
    });

    adjustTextareaHeight();
    loadConversationState();
</script>
</body>
</html>
